name: silly_gun_ultimate
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.5
  animated_text_kit: ^4.3.0
  animations: ^2.2.0
  flutter_colorpicker: ^1.1.0
  flutter_staggered_grid_view: ^0.7.0
  gal: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.6.0
  internet_connection_checker: ^3.0.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  photo_view: ^0.15.0
  provider: ^6.1.5+1
  share_plus: ^13.1.0
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0
  stylish_bottom_bar: ^1.1.1
  url_launcher: ^6.3.2
  video_player: ^2.11.1
  wallpaper_manager_plus: ^2.0.3
  workmanager: ^0.9.0+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/utils/
    - assets/fonts/
    - assets/splash/
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque/BricolageGrotesque-Light.ttf
          weight: 300
        - asset: assets/fonts/BricolageGrotesque/BricolageGrotesque-Regular.ttf
          weight: 400
        - asset: assets/fonts/BricolageGrotesque/BricolageGrotesque-Medium.ttf
          weight: 500
        - asset: assets/fonts/BricolageGrotesque/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque/BricolageGrotesque-ExtraBold.ttf
          weight: 800
